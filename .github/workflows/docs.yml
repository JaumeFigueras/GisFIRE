# Build the Sphinx documentation and publish it to GitHub Pages.
#
# Runs only when something the documentation is built from changes:
#   - docs/**                the reStructuredText pages and conf.py
#   - src/**                 the API reference pages are generated by autodoc
#                            from the docstrings, so a code change can change them
#   - requirements/**        the build environment
#   - this workflow file
#
# On a push to main the site is built and deployed. On a pull request, or a push
# to any other branch, it is only built, so a broken page fails the check before
# it reaches main. Warnings fail the build (-W): the docs build cleanly today and
# should stay that way.
#
# One-time setup on GitHub: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". The site is then served at
# https://jaumefigueras.github.io/GisFIRE/

name: documentation

on:
  push:
    paths:
      - "docs/**"
      - "src/**"
      - "requirements/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "requirements/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push cancels a build still in progress.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/docs.txt

      - name: Install dependencies
        run: pip install -r requirements/docs.txt

      - name: Build the documentation
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
